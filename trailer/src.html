<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Muneeb Arif Trailer</title>
<style>
  html, body { margin: 0; height: 100%; background: #0B1120; overflow: hidden; }
  canvas {
    position: fixed; inset: 0; margin: auto; display: block;
    width: min(100vw, 177.7778vh); height: min(56.25vw, 100vh);
  }
  #scrub { position: fixed; left: 16px; right: 16px; bottom: 12px; z-index: 2; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
window.DURATION = 30;

/* =====================================================================
   STYLE TOKENS, taken from the muneebarifai.com source
   (tailwind.config.js, src/index.css, Hero.tsx, ClosingCTA.tsx, Nav.tsx)
   ===================================================================== */
const THEME = {
  bg:      '#0B1120',               // ink: page background
  scrim:   '10,15,28',              // hero scrim rgb, rgba(10,15,28,a)
  heading: '#F2EDE4',               // --heading: headline text
  cream:   '#E8E6DE',               // cream: body text
  muted:   '#8A94A8',               // --muted: eyebrow / labels
  gold:    '#D9A441',               // --gold: the key word ("premium")
  goldRgb: '217,164,65',
  ember:   '#C8A98C',               // ember: closing serif accent ("worth watching.")
  sans:    'Almarai',               // workhorse
  serif:   '"Instrument Serif"',    // italic accent
  frameInset:  0,                   // image shots run full bleed (the site's 24px inset
  frameRadius: 0,                   // and 32px corners read as a black border in a player)
  cardRadius:  12,                  // cards: 12px
  name: 'MUNEEB ARIF',              // wordmark, tracking 0.28em
  url:  'muneebarifai.com'
};

/* Site motion curve: cubic-bezier(0.16, 1, 0.3, 1) */
const SITE_BEZIER = [0.16, 1, 0.3, 1];

/*__ASSETS__*/

/* ===================================================================== */

const W = 1920, H = 1080;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const off = document.createElement('canvas');
off.width = W; off.height = H;
const octx = off.getContext('2d');

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, p) => a + (b - a) * p;
const eOut = p => 1 - Math.pow(1 - clamp(p), 3);
const eIn = p => Math.pow(clamp(p), 3);
const eInOut = p => { p = clamp(p); return p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2; };
const eBack = p => { p = clamp(p); const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); };

function bezier(x1, y1, x2, y2) {
  const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
  const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
  const sx = t => ((ax * t + bx) * t + cx) * t;
  const sy = t => ((ay * t + by) * t + cy) * t;
  const dx = t => (3 * ax * t + 2 * bx) * t + cx;
  return p => {
    p = clamp(p);
    let t = p;
    for (let i = 0; i < 8; i++) {
      const e = sx(t) - p, d = dx(t);
      if (Math.abs(e) < 1e-6 || Math.abs(d) < 1e-6) break;
      t = clamp(t - e / d);
    }
    return sy(t);
  };
}
const eSite = bezier(...SITE_BEZIER);

function rng(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ t >>> 15, t | 1);
    t ^= t + Math.imul(t ^ t >>> 7, t | 61);
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

/* ---------- assets ---------- */

const IMG = {};

/* Hero footage frames decode on demand (holding every frame decoded at once
   can exceed the browser's decoded-image budget). A small cache keeps neighbouring frames warm. */
const CLIP_CACHE = new Map();
const clipIndex = u => Math.min(CLIP.length - 1, Math.max(0, Math.floor(u * CLIP_FPS)));
/* The hero footage plays at 3-5s (behind the split and "I direct") and 25-27s (the wall and the dive). */
const clipTime = t => (t >= 3 && t < 5) ? t - 3 : (t >= 25 && t < 27) ? t - 25 : null;
async function ensureClip(i) {
  if (CLIP_CACHE.has(i)) return;
  const im = new Image();
  im.src = CLIP[i];
  await im.decode();
  CLIP_CACHE.set(i, im);
  while (CLIP_CACHE.size > 12) CLIP_CACHE.delete(CLIP_CACHE.keys().next().value);
}
const GRAIN = [];

function makeGrain() {
  for (let k = 0; k < 6; k++) {
    const c = document.createElement('canvas');
    c.width = 512; c.height = 512;
    const g = c.getContext('2d');
    const d = g.createImageData(512, 512);
    const r = rng(9000 + k);
    for (let p = 0; p < d.data.length; p += 4) {
      const v = r() * 255;
      d.data[p] = d.data[p + 1] = d.data[p + 2] = v;
      d.data[p + 3] = 255;
    }
    g.putImageData(d, 0, 0);
    GRAIN.push(c);
  }
}

const ready = (async () => {
  for (const f of FONTS) {
    const ff = new FontFace(f.family, `url(${f.src})`, { weight: String(f.weight), style: f.style });
    await ff.load();
    document.fonts.add(ff);
  }
  await Promise.all(Object.keys(IMAGES).map(async k => {
    const im = new Image();
    im.src = IMAGES[k];
    await im.decode();
    IMG[k] = im;
  }));

  makeGrain();
  buildWall();
  await document.fonts.ready;
})();

/* ---------- type ---------- */

const SANS_BOLD = { family: THEME.sans, weight: 800, style: 'normal', track: -0.01 };
const SANS = { family: THEME.sans, weight: 400, style: 'normal', track: -0.01 };
const EYEBROW = { family: THEME.sans, weight: 400, style: 'normal', track: 0.2 };
const SERIF = { family: THEME.serif, weight: 400, style: 'italic', track: 0, k: 1.1 };

function setFont(g, size, o) {
  g.font = `${o.style} ${o.weight} ${size * (o.k || 1)}px ${o.family}`;
  if ('letterSpacing' in g) g.letterSpacing = (size * (o.k || 1) * (o.track || 0)) + 'px';
  g.textAlign = 'left';
  g.textBaseline = 'alphabetic';
}

function segWidth(g, text, size, o) {
  setFont(g, size, o);
  const tr = ('letterSpacing' in g) ? size * (o.k || 1) * (o.track || 0) : 0;
  return g.measureText(text).width - tr;
}

/* A line made of styled segments [{ t, o, c }], sharing one baseline. */
function measureSegs(g, segs, size) {
  return segs.reduce((w, s) => w + segWidth(g, s.t, size, s.o), 0);
}

function fitSegs(segs, targetW, maxSize = 9999) {
  return Math.min(maxSize, 100 * targetW / measureSegs(ctx, segs, 100));
}

function capHeight(g, size, o) {
  setFont(g, size, o);
  return g.measureText('H').actualBoundingBoxAscent;
}

function rich(g, segs, x, cy, size, { scale = 1, dx = 0, dy = 0, alpha = 1, align = 'center' } = {}) {
  const w = measureSegs(g, segs, size);
  const ch = capHeight(g, size, segs[0].o);
  g.save();
  g.translate(x + dx, cy + dy);
  g.scale(scale, scale);
  g.globalAlpha *= alpha;
  let px = align === 'center' ? -w / 2 : 0;
  for (const s of segs) {
    setFont(g, size, s.o);
    g.fillStyle = s.c || THEME.heading;
    g.fillText(s.t, px, ch / 2);
    px += segWidth(g, s.t, size, s.o);
  }
  g.restore();
}

const seg = (t, o = SANS_BOLD, c = THEME.heading) => [{ t, o, c }];

/* Letter by letter; fn(i) returns { dx, dy, rot }. */
function chars(g, text, cx, cy, size, o, color, fn) {
  g.save();
  const total = segWidth(g, text, size, o);
  const ch = capHeight(g, size, o);
  const x0 = cx - total / 2;
  g.fillStyle = color;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (c === ' ') continue;
    const x = x0 + g.measureText(text.slice(0, i)).width;
    const cw = g.measureText(c).width;
    const tr = fn(i);
    if (tr.alpha === 0) continue;
    g.save();
    g.translate(x + cw / 2 + tr.dx, cy + tr.dy);
    g.rotate(tr.rot || 0);
    g.scale(tr.sx == null ? 1 : tr.sx, tr.sy == null ? 1 : tr.sy);
    if (tr.alpha != null) g.globalAlpha *= tr.alpha;
    g.fillText(c, -cw / 2, ch / 2);
    g.restore();
  }
  g.restore();
}

/* Words with extra space between them. */
function words(g, list, cx, cy, size, gap, { dys = [] } = {}) {
  const space = segWidth(g, ' ', size, list[0].o);
  const ws = list.map(w => segWidth(g, w.t, size, w.o));
  const total = ws.reduce((a, b) => a + b, 0) + (space + gap) * (list.length - 1);
  const ch = capHeight(g, size, list[0].o);
  let x = cx - total / 2;
  g.save();
  list.forEach((w, i) => {
    setFont(g, size, w.o);
    g.fillStyle = w.c || THEME.heading;
    g.fillText(w.t, x, cy + ch / 2 + (dys[i] || 0));
    x += ws[i] + space + gap;
  });
  g.restore();
}

/* ---------- image ---------- */

function roundRect(g, x, y, w, h, r) {
  g.beginPath();
  g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r);
  g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r);
  g.arcTo(x, y, x + w, y, r);
  g.closePath();
}

function cover(g, img, x, y, w, h, { scale = 1, ox = 0, oy = 0, filter = null, alpha = 1, radius = 0 } = {}) {
  const iw = img.naturalWidth || img.width, ih = img.naturalHeight || img.height;
  const s = Math.max(w / iw, h / ih) * scale;
  const dw = iw * s, dh = ih * s;
  g.save();
  if (radius) roundRect(g, x, y, w, h, radius); else { g.beginPath(); g.rect(x, y, w, h); }
  g.clip();
  if (filter) g.filter = filter;
  g.globalAlpha *= alpha;
  g.drawImage(img, x + (w - dw) / 2 + ox, y + (h - dh) / 2 + oy, dw, dh);
  g.restore();
}

/* The site's hero treatment: inset rounded frame, left-to-right navy scrim,
   legibility gradient up from ink. */
function heroFrame(img, opts, { scrim = 0.75, floor = 0.9 } = {}) {
  const i = THEME.frameInset, r = THEME.frameRadius;
  cover(ctx, img, i, i, W - 2 * i, H - 2 * i, Object.assign({ radius: r }, opts));
  frameScrims(scrim, floor);
}

function frameScrims(scrim, floor, alpha = 1) {
  const i = THEME.frameInset, r = THEME.frameRadius;
  const x = i, y = i, w = W - 2 * i, h = H - 2 * i;
  ctx.save();
  ctx.globalAlpha = alpha;
  roundRect(ctx, x, y, w, h, r);
  ctx.clip();
  const lr = ctx.createLinearGradient(x, 0, x + w, 0);
  lr.addColorStop(0, `rgba(${THEME.scrim},${scrim})`);
  lr.addColorStop(0.6, `rgba(${THEME.scrim},${scrim * 0.4})`);
  lr.addColorStop(1, `rgba(${THEME.scrim},0)`);
  ctx.fillStyle = lr;
  ctx.fillRect(x, y, w, h);
  const bt = ctx.createLinearGradient(0, y + h, 0, y);
  bt.addColorStop(0, `rgba(11,17,32,${floor})`);
  bt.addColorStop(0.5, `rgba(11,17,32,${floor * 0.3})`);
  bt.addColorStop(1, 'rgba(11,17,32,0)');
  ctx.fillStyle = bt;
  ctx.fillRect(x, y, w, h);
  ctx.restore();
}

/* The site's ambient glow: a whisper of gold anchored top centre. */
function glow() {
  const rg = ctx.createRadialGradient(W / 2, H * 0.18, 0, W / 2, H * 0.18, H * 0.9);
  rg.addColorStop(0, `rgba(${THEME.goldRgb},0.05)`);
  rg.addColorStop(0.34, `rgba(${THEME.goldRgb},0.02)`);
  rg.addColorStop(0.72, 'rgba(16,26,48,0)');
  ctx.fillStyle = rg;
  ctx.fillRect(0, 0, W, H);
}

/* Evidence: a frame cut out with a torn edge. */
const tornCache = {};
function tornPath(seed, w, h) {
  const key = seed + ':' + w + ':' + h;
  if (tornCache[key]) return tornCache[key];
  const r = rng(seed), pts = [], step = 18;
  const j = () => (r() - .5) * 9 + (r() < .08 ? (r() - .5) * 26 : 0);
  for (let x = 0; x < w; x += step) pts.push([x, j()]);
  for (let y = 0; y < h; y += step) pts.push([w + j(), y]);
  for (let x = w; x > 0; x -= step) pts.push([x, h + j()]);
  for (let y = h; y > 0; y -= step) pts.push([j(), y]);
  return (tornCache[key] = pts);
}

function torn(img, cx, cy, w, h, rot, seed, filter) {
  const pts = tornPath(seed, w, h);
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(rot);
  ctx.translate(-w / 2, -h / 2);
  ctx.beginPath();
  pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]));
  ctx.closePath();
  ctx.shadowColor = 'rgba(0,0,0,0.75)';
  ctx.shadowBlur = 50;
  ctx.shadowOffsetY = 18;
  ctx.fillStyle = THEME.bg;
  ctx.fill();
  ctx.shadowColor = 'transparent';
  ctx.clip();
  cover(ctx, img, 0, 0, w, h, { filter, scale: 1.04 });
  ctx.restore();
}

/* Type filled with a moving frame; outside the letters stays ink. The frame is
   screened over a warm base so navy areas never sink into the background. */
function masked(segs, cx, cy, size, img, imgOpts, textOpts = {}) {
  const paint = c => rich(octx, segs.map(s => Object.assign({}, s, { c })), cx, cy, size, textOpts);
  octx.setTransform(1, 0, 0, 1, 0, 0);
  octx.globalCompositeOperation = 'source-over';
  octx.clearRect(0, 0, W, H);
  paint('#6E6A62');
  octx.globalCompositeOperation = 'screen';
  cover(octx, img, 0, 0, W, H, imgOpts);
  octx.globalCompositeOperation = 'destination-in';
  paint('#fff');
  octx.globalCompositeOperation = 'source-over';
  ctx.drawImage(off, 0, 0);
}

/* Like masked(), but the caller paints the letterforms (for per-letter motion).
   The letters are painted into their own mask canvas first and applied in a
   single destination-in pass (painted letter by letter in that mode, each
   letter would erase the ones before it). `band` ({ y, h }) optionally limits
   the mask to a horizontal band, so letters can rise from below a baseline. */
const mcv = document.createElement('canvas');
mcv.width = W; mcv.height = H;
const mctx = mcv.getContext('2d');

function maskedPaint(paint, img, imgOpts, band) {
  mctx.setTransform(1, 0, 0, 1, 0, 0);
  mctx.globalCompositeOperation = 'source-over';
  mctx.clearRect(0, 0, W, H);
  paint(mctx, '#fff');
  if (band) {
    mctx.globalCompositeOperation = 'destination-in';
    mctx.fillStyle = '#fff';
    mctx.fillRect(0, band.y, W, band.h);
    mctx.globalCompositeOperation = 'source-over';
  }
  octx.setTransform(1, 0, 0, 1, 0, 0);
  octx.globalCompositeOperation = 'source-over';
  octx.clearRect(0, 0, W, H);
  paint(octx, '#6E6A62');
  octx.globalCompositeOperation = 'screen';
  cover(octx, img, 0, 0, W, H, imgOpts);
  octx.globalCompositeOperation = 'destination-in';
  octx.drawImage(mcv, 0, 0);
  octx.globalCompositeOperation = 'source-over';
  ctx.drawImage(off, 0, 0);
}

/* Impact: the type lands from oversize with a short decaying shake. */
function slam(lt, amp = 0.12, dur = 0.17, shake = 10) {
  const k = Math.exp(-lt * 13);
  return {
    scale: 1 + amp * (1 - eOut(lt / dur)),
    dx: shake * k * Math.sin(lt * 95),
    dy: shake * 0.6 * k * Math.cos(lt * 71)
  };
}

/* The site's reveal: fade up from a short rise on the site curve. */
function rise(lt, dur = 0.7, dist = 20) {
  const p = eSite(lt / dur);
  return { alpha: p, dy: (1 - p) * dist };
}

function grain(t) {
  const f = Math.floor(t * 24);
  const tile = GRAIN[f % GRAIN.length];
  const r = rng(f * 131 + 7);
  const ox = -Math.floor(r() * 512), oy = -Math.floor(r() * 512);
  ctx.save();
  ctx.globalAlpha = 0.045;
  for (let y = oy; y < H; y += 512) for (let x = ox; x < W; x += 512) ctx.drawImage(tile, x, y);
  ctx.restore();
}

/* ---------- beats: one function per whole second, lt = 0..1 within it ---------- */

const COLD = seg("I don't generate visuals.");

function coldLine(t, s = { scale: 1, dx: 0, dy: 0 }) {
  const size = fitSegs(COLD, 1500);
  const creep = 1 + 0.015 * clamp((t - 1) / 3);
  rich(ctx, COLD, W / 2, H / 2, size, { scale: s.scale * creep, dx: s.dx, dy: s.dy });
}

/* ---------- cold open: a wall of the work under a sweeping light ---------- */

const WALL_KEYS = ['film', 'gown', 'anat1', 'elf1', 'stall', 'hero', 'family',
  'anat2', 'elf7', 'couple', 'lips', 'crowd', 'anat3', 'home'];
const WALL_CELL = { w: 340, h: 220, gap: 18, cols: 9, rows: 7 };
let WALL_DIM = null, WALL_LIT = null;

/* Pre-rendered once at load: the same brick-laid wall, graded dark and graded lit. */
function buildWall() {
  const { w, h, gap, cols, rows } = WALL_CELL;
  const make = filter => {
    const c = document.createElement('canvas');
    c.width = (cols + 1) * (w + gap);
    c.height = rows * (h + gap);
    const g = c.getContext('2d');
    for (let r = 0; r < rows; r++) {
      // Each row is its own seeded shuffle, so no pattern repeats across the wall.
      const rr = rng(300 + r);
      const row = WALL_KEYS.map(k => [rr(), k]).sort((a, b) => a[0] - b[0]).map(e => e[1]);
      for (let q = 0; q <= cols; q++) {
        const x = q * (w + gap) - (r % 2 ? (w + gap) / 2 : 0), y = r * (h + gap);
        cover(g, IMG[row[q % row.length]], x, y, w, h, { radius: 10, filter });
      }
    }
    return c;
  };
  WALL_DIM = make('grayscale(0.75) brightness(0.42) contrast(1.1)');
  WALL_LIT = make('grayscale(0.1) brightness(1.05)');
}

function coldWall(t) {
  const emerge = eInOut((t - 0.4) / 0.6);
  if (emerge <= 0) return;
  const sh = t >= 1 && t < 2 ? slam(t - 1, 0, 0.17, 6) : { dx: 0, dy: 0 };
  const ox = -380 - 70 * t + sh.dx, oy = -260 - 28 * t + sh.dy;
  ctx.save();
  ctx.globalAlpha = emerge;
  ctx.drawImage(WALL_DIM, ox, oy);

  // The spotlight: the lit wall through a moving radial mask; it flares on the slam.
  const flash = t >= 1 ? Math.exp(-(t - 1) * 9) : 0;
  const sx = lerp(260, 1660, eInOut((t - 0.4) / 2.6)), sy = 400 + 140 * Math.sin(t * 1.3);
  const sr = Math.max(1, 620 * eOut((t - 0.4) / 0.7));
  octx.setTransform(1, 0, 0, 1, 0, 0);
  octx.globalCompositeOperation = 'source-over';
  octx.clearRect(0, 0, W, H);
  octx.drawImage(WALL_LIT, ox, oy);
  octx.globalCompositeOperation = 'destination-in';
  const rg = octx.createRadialGradient(sx, sy, 0, sx, sy, sr);
  rg.addColorStop(0, `rgba(0,0,0,${0.8 + 0.2 * flash})`);
  rg.addColorStop(0.6, `rgba(0,0,0,${0.3 + 0.45 * flash})`);
  rg.addColorStop(1, `rgba(0,0,0,${0.5 * flash})`);
  octx.fillStyle = rg;
  octx.fillRect(0, 0, W, H);
  octx.globalCompositeOperation = 'source-over';
  ctx.drawImage(off, 0, 0);

  // Ink wash, a calm elliptical band behind the type, and a heavy vignette.
  ctx.fillStyle = 'rgba(11,17,32,0.45)';
  ctx.fillRect(0, 0, W, H);
  ctx.save();
  ctx.translate(W / 2, H / 2);
  ctx.scale(1, 0.28);
  const band = ctx.createRadialGradient(0, 0, 0, 0, 0, 1050);
  band.addColorStop(0, 'rgba(11,17,32,0.78)');
  band.addColorStop(1, 'rgba(11,17,32,0)');
  ctx.fillStyle = band;
  ctx.fillRect(-W, -H * 4, W * 2, H * 8);
  ctx.restore();
  ctx.restore();
  ctx.save();
  ctx.globalAlpha = emerge;
  vignetteInk(0.75);
  ctx.restore();
}

function vignetteInk(strength) {
  const rg = ctx.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, H * 1.05);
  rg.addColorStop(0, 'rgba(11,17,32,0)');
  rg.addColorStop(1, `rgba(11,17,32,${strength})`);
  ctx.fillStyle = rg;
  ctx.fillRect(0, 0, W, H);
}

/* Evidence pulled off the wall into two fixed slots, mirrored about the
   frame centre: 150px side margins, clear of the line above and below. */
const SLOTS = [
  { key: 'film', x: 150, y: 76, w: 576, h: 324, rot: -0.045, seed: 11, from: { dx: 260, dy: 180 } },
  { key: 'home', x: 1194, y: 684, w: 576, h: 324, rot: 0.04, seed: 23, from: { dx: -260, dy: -180 } }
];

function evidence(sl, p) {
  if (p <= 0) return;
  const cx = sl.x + sl.w / 2 + sl.from.dx * (1 - p), cy = sl.y + sl.h / 2 + sl.from.dy * (1 - p);
  ctx.save();
  ctx.globalAlpha = clamp(p * 2.5);
  ctx.translate(cx, cy);
  ctx.scale(lerp(0.55, 1, p), lerp(0.55, 1, p));
  torn(IMG[sl.key], 0, 0, sl.w, sl.h, sl.rot * (1 + 2 * (1 - p)), sl.seed,
    `grayscale(${lerp(0.9, 0.15, p).toFixed(3)}) brightness(${lerp(0.5, sl.key === 'home' ? 1.35 : 0.95, p).toFixed(3)})`);
  ctx.restore();
}

function coldScene(t) {
  ctx.fillStyle = THEME.bg;
  ctx.fillRect(0, 0, W, H);
  coldWall(t);
  SLOTS.forEach((sl, i) => evidence(sl, eSite((t - 2 - i * 0.1) / 0.45)));
  coldLine(t);
}

/* 21s reel: three rows of photographic frames, one height, one gutter.
   960px of rows centred in the frame leaves equal 60px margins top and bottom.
   Rows run left, right, left so neighbours slide against each other. */
const REEL = { h: 300, gap: 30, y: [60, 390, 720] };
const REEL_ROWS = [
  { dir: -1, dist: 900, x0: -140, keys: [['hero'], ['set05', 1], ['crowd'], ['elf1', 1], ['film'], ['set04', 1], ['anat3']] },
  { dir: 1, dist: 1000, x0: -1060, keys: [['couple'], ['elf7', 1], ['anat1'], ['family', 1], ['lips'], ['set07', 1], ['spoon']] },
  { dir: -1, dist: 1000, x0: -100, keys: [['stall'], ['gown', 1], ['anat4'], ['elf9', 1], ['anat2'], ['elf4', 1], ['cup']] }
];

function reelCard(img, x, y, w, h) {
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,0.55)';
  ctx.shadowBlur = 30;
  ctx.shadowOffsetY = 14;
  ctx.fillStyle = '#182444';
  roundRect(ctx, x, y, w, h, THEME.cardRadius);
  ctx.fill();
  ctx.restore();
  cover(ctx, img, x, y, w, h, { radius: THEME.cardRadius });
}

const BEATS = [
  // 0  darkness, then the wall of work surfaces under a moving light
  (lt, t) => coldWall(t),

  // 1  the line slams in; the light flares and the wall shakes with it
  (lt, t) => {
    coldWall(t);
    coldLine(t, slam(lt, 0.12, 0.17, 12));
  },

  // 2  two frames are pulled off the wall into the light, above and below the line
  (lt, t) => coldScene(t),

  // 3  the frame splits through the line and slides apart on the hero film
  (lt, t) => {
    heroFrame(clipFrame(lt), { scale: lerp(1.06, 1.03, lt) }, { scrim: 0.55, floor: 0.6 });
    const p = eInOut((lt - 0.12) / 0.7);
    if (p >= 1) return;
    const d = p * (H / 2 + 60);
    const shadow = (y, dir) => {
      const g = ctx.createLinearGradient(0, y, 0, y + dir * 80);
      g.addColorStop(0, 'rgba(0,0,0,0.55)');
      g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g;
      ctx.fillRect(0, Math.min(y, y + dir * 80), W, 80);
    };
    shadow(H / 2 - d, 1);
    shadow(H / 2 + d, -1);
    [[0, -1], [H / 2, 1]].forEach(([y0, dir]) => {
      ctx.save();
      ctx.beginPath();
      ctx.rect(0, y0 + dir * d, W, H / 2);
      ctx.clip();
      ctx.translate(0, dir * d);
      coldScene(t);
      ctx.restore();
    });
  },

  // 4  "I direct" lands in the open sky, top left, clear of the figure
  (lt) => {
    heroFrame(clipFrame(1 + lt), { scale: lerp(1.03, 1.0, lt) }, { scrim: 0.55, floor: 0.6 });
    const size = 300;
    const x = 120 + inkLeft('I direct', size, SANS_BOLD);
    rich(ctx, seg('I direct'), x, 310, size, Object.assign({ align: 'left' }, slam(lt)));
  },

  // 5  "stories." lands in the serif accent
  (lt) => {
    glow();
    const top = seg('I direct');
    const bot = seg('stories.', SERIF, THEME.gold);
    const size = Math.min(fitSegs(top, 1250), fitSegs(bot, 1250), 300);
    rich(ctx, top, W / 2, H / 2 - size * 0.62, size);
    rich(ctx, bot, W / 2, H / 2 + size * 0.62, size, slam(lt, 0.14));
  },

  // 6  the About banner pulls back; "that happen to be" rises word by word, then
  //    "made", "with", "AI." slam in one after another, top left over the dark wall
  (lt) => {
    cover(ctx, IMG.about, 0, 0, W, H, { scale: lerp(1.14, 1.04, eOut(lt)), ox: lerp(40, 0, eOut(lt)), oy: 30 });
    const lr = ctx.createLinearGradient(0, 0, W, 0);
    lr.addColorStop(0, 'rgba(10,15,28,0.7)');
    lr.addColorStop(0.55, 'rgba(10,15,28,0.25)');
    lr.addColorStop(1, 'rgba(10,15,28,0)');
    ctx.fillStyle = lr;
    ctx.fillRect(0, 0, W, H);
    const tb = ctx.createLinearGradient(0, 0, 0, H);
    tb.addColorStop(0, 'rgba(10,15,28,0.65)');
    tb.addColorStop(0.5, 'rgba(10,15,28,0)');
    ctx.fillStyle = tb;
    ctx.fillRect(0, 0, W, H);

    const x = 120;
    const s1 = 76, o1 = SERIF;
    const words1 = ['that', 'happen', 'to', 'be'];
    const cap1 = capHeight(ctx, s1, o1);
    const y1 = 150 + cap1 / 2;
    const sp1 = segWidth(ctx, ' ', s1, o1);
    let wx = x + inkLeft('that', s1, o1);
    words1.forEach((w, i) => {
      const r = rise(lt - 0.04 - i * 0.06, 0.45, 22);
      rich(ctx, seg(w, o1, THEME.ember), wx, y1, s1, { align: 'left', alpha: r.alpha, dy: r.dy });
      wx += segWidth(ctx, w, s1, o1) + sp1;
    });

    const o2 = SANS_BOLD;
    const s2 = fitSegs(seg('made with AI.'), 1000, 190);
    const cap2 = capHeight(ctx, s2, o2);
    const y2 = 150 + cap1 + 44 + cap2 / 2;
    const sp2 = segWidth(ctx, ' ', s2, o2);
    let vx = x + inkLeft('made', s2, o2);
    [['made', THEME.heading, 0.3, 0.12], ['with', THEME.heading, 0.4, 0.12], ['AI.', THEME.gold, 0.52, 0.2]].forEach(([w, c, at, amp]) => {
      const ww = segWidth(ctx, w, s2, o2);
      if (lt >= at) {
        const sl = slam(lt - at, amp, 0.12, amp * 60);
        ctx.save();
        ctx.translate(vx + ww / 2 + sl.dx, y2 + sl.dy);
        ctx.scale(sl.scale, sl.scale);
        rich(ctx, seg(w, o2, c), -ww / 2, 0, s2, { align: 'left' });
        ctx.restore();
      }
      vx += ww + sp2;
    });
  },

  // 7  B-roll: the crowd, cold and moving, before the warm stall
  (lt) => heroFrame(IMG.crowd, { scale: lerp(1.12, 1.0, eOut(lt)), ox: lerp(-50, 50, lt) }, { scrim: 0.15, floor: 0.35 }),

  // 8  B-roll breath, no type
  (lt) => heroFrame(IMG.stall, { scale: lerp(1.0, 1.14, eOut(lt)), ox: lerp(40, -40, lt) }, { scrim: 0.15, floor: 0.35 }),

  // 9  the brief, as the site's statement reveals it
  (lt) => {
    glow();
    const r = rise(lt, 0.6, 24);
    rich(ctx, seg('You bring the brief.', SANS, THEME.cream), W / 2, H / 2, 96, { alpha: r.alpha, dy: r.dy });
  },

  // 10 "I bring"
  (lt) => {
    const s = seg('I bring');
    rich(ctx, s, W / 2, H / 2, fitSegs(s, 1650, 520), slam(lt, 0.14, 0.17, 14));
  },

  // 11 "the story," with the work inside the letters
  (lt) => {
    const s = seg('the story,');
    masked(s, W / 2, H / 2, fitSegs(s, 1650, 400), IMG.gown,
      { scale: lerp(1.05, 1.16, lt), oy: lerp(60, -60, lt), filter: 'brightness(1.3) contrast(1.05)' },
      { scale: 1 + 0.05 * (1 - eOut(lt / 0.2)) });
  },

  // 12 "the direction," with a hard push
  (lt) => {
    const s = seg('the direction,');
    masked(s, W / 2, H / 2, fitSegs(s, 1700, 400), IMG.anat3,
      { scale: lerp(1.0, 1.28, eOut(lt)), filter: 'brightness(1.3) contrast(1.05)' },
      { scale: 1 + 0.05 * (1 - eOut(lt / 0.2)) });
  },

  // 13 "and the finish." lands, then scatters
  (lt) => {
    const text = 'and the finish.';
    const size = fitSegs(seg(text), 1500, 260);
    const s = slam(lt, 0.1);
    const p = eIn((lt - 0.38) / 0.62);
    chars(ctx, text, W / 2 + s.dx, H / 2 + s.dy, size, SANS_BOLD, THEME.heading, i => {
      const r = rng(500 + i);
      const a = r() * Math.PI * 2, d = 600 + r() * 1100;
      return { dx: Math.cos(a) * d * p, dy: Math.sin(a) * d * p, rot: (r() - .5) * 1.4 * p };
    });
  },

  // 14 "Story. Direction. Finish." reassembles on the left while the Work page,
  //    the finished campaigns, slides in on the right and scrolls
  (lt) => {
    glow();
    // the Work page in a card: 800 x 900, 120px from the right edge, centred vertically
    const card = { x: 1000, y: 90, w: 800, h: 900, r: 16 };
    const cp = eSite(lt / 0.55);
    const cx = card.x + (1 - cp) * 160;
    ctx.save();
    ctx.globalAlpha = clamp(cp * 1.6);
    ctx.shadowColor = 'rgba(0,0,0,0.55)';
    ctx.shadowBlur = 50;
    ctx.shadowOffsetY = 20;
    ctx.fillStyle = THEME.bg;
    roundRect(ctx, cx, card.y, card.w, card.h, card.r);
    ctx.fill();
    ctx.shadowColor = 'transparent';
    const img = IMG.workpage;
    const sc = card.w / img.naturalWidth;
    const maxScroll = img.naturalHeight * sc - card.h;
    // the page scrolls one step as each word lands
    const lands = [0.4, 0.58, 0.76];
    const scroll = maxScroll * lands.reduce((a, l) => a + eSite((lt - l) / 0.35) / 3, 0);
    ctx.save();
    roundRect(ctx, cx, card.y, card.w, card.h, card.r);
    ctx.clip();
    ctx.drawImage(img, cx, card.y - scroll, card.w, img.naturalHeight * sc);
    ctx.restore();
    ctx.restore();

    // the three words, left aligned on the 120px edge: each flies back in from the
    // scatter in turn, punches as it lands, then drifts so the stack never sits still
    const rows = [['Story.', SANS_BOLD, THEME.heading], ['Direction.', SANS_BOLD, THEME.heading], ['Finish.', SERIF, THEME.gold]];
    const size = fitSegs(seg('Direction.'), 780, 200);
    rows.forEach(([text, o, c], k) => {
      const start = k * 0.18, land = lands[k];
      const p = eOut((lt - start) / (land - start));
      const after = Math.max(0, lt - land);
      const punch = lt >= land ? 1 + 0.07 * Math.exp(-after * 14) : 1;
      const drift = (k % 2 ? -1 : 1) * 16 * eInOut(after / (1 - land));
      const cy = H / 2 + (k - 1) * size * 1.08;
      const cxRow = 120 + inkLeft(text, size, o) + segWidth(ctx, text, size, o) / 2;
      ctx.save();
      ctx.translate(120 + drift, cy);
      ctx.scale(punch, punch);
      ctx.translate(-120, -cy);
      chars(ctx, text, cxRow, cy, size, o, c, i => {
        const r = rng(800 + k * 50 + i);
        const a = r() * Math.PI * 2, d = 700 + r() * 900;
        return { dx: Math.cos(a) * d * (1 - p), dy: Math.sin(a) * d * (1 - p), rot: (r() - .5) * 1.4 * (1 - p), alpha: lt < start ? 0 : 1 };
      });
      ctx.restore();
    });
  },

  // 15 three panels sliding against each other
  (lt) => {
    const imgs = [IMG.elf1, IMG.family, IMG.stryde];
    const i0 = THEME.frameInset, gap = 16;
    const pw = (W - 2 * i0 - 2 * gap) / 3, ph = H - 2 * i0;
    imgs.forEach((img, i) => {
      const dir = i % 2 ? 1 : -1;
      const enter = eOut((lt - i * 0.07) / 0.28);
      const y = i0 + dir * (1 - enter) * H;
      cover(ctx, img, i0 + i * (pw + gap), y, pw, ph, { scale: 1.2, oy: dir * lerp(-90, 90, lt), radius: THEME.cardRadius });
    });
  },

  // 16 "Cinematic": letters rise one by one out of a hidden baseline, the hero film inside them
  (lt) => {
    const text = 'Cinematic';
    const size = fitSegs(seg(text), 1700);
    const ch = capHeight(ctx, size, SANS_BOLD);
    const paint = (g, c) => chars(g, text, W / 2, H / 2, size, SANS_BOLD, c, i => {
      const p = eSite((lt - i * 0.035) / 0.42);
      return { dx: 0, dy: (1 - p) * size * 1.05 };
    });
    maskedPaint(paint, IMG.hero, { scale: lerp(1.0, 1.12, lt), filter: 'brightness(1.2) contrast(1.1)' },
      { y: H / 2 - size, h: size + ch / 2 + size * 0.28 });
  },

  // 17 "brand films.": the words fly in from opposite edges and collide in the centre
  (lt) => {
    glow();
    const size = fitSegs(seg('brand films.'), 1600, 340);
    const wB = segWidth(ctx, 'brand', size, SANS_BOLD), wS = segWidth(ctx, ' ', size, SANS_BOLD);
    const x0 = W / 2 - segWidth(ctx, 'brand films.', size, SANS_BOLD) / 2, xF = x0 + wB + wS;
    const hit = 0.16;
    const s = lt >= hit ? slam(lt - hit, 0.07, 0.12, 22) : { scale: 1, dx: 0, dy: 0 };
    const draw = (tt, alpha) => {
      const p = Math.pow(clamp(tt / hit), 2);
      rich(ctx, seg('brand'), x0 - (1 - p) * (x0 + wB + 120), H / 2, size, { align: 'left', alpha });
      rich(ctx, seg('films.'), xF + (1 - p) * (W - xF + 120), H / 2, size, { align: 'left', alpha });
    };
    ctx.save();
    ctx.translate(W / 2 + s.dx, H / 2 + s.dy);
    ctx.scale(s.scale, s.scale);
    ctx.translate(-W / 2, -H / 2);
    if (lt < hit) [3, 2, 1].forEach(k => draw(lt - k * 0.018, 0.22 / k));
    draw(lt, 1);
    ctx.restore();
  },

  // 18 "Directed,": letters flip down into place left to right, the word punches as the last lands
  (lt) => {
    glow();
    const text = 'Directed,';
    const size = fitSegs(seg(text), 1450, 340);
    const land = 0.03 * (text.length - 1) + 0.28;
    const s = lt >= land ? slam(lt - land, 0.05, 0.12, 12) : { scale: 1, dx: 0, dy: 0 };
    ctx.save();
    ctx.translate(W / 2 + s.dx, H / 2 + s.dy);
    ctx.scale(s.scale, s.scale);
    ctx.translate(-W / 2, -H / 2);
    chars(ctx, text, W / 2, H / 2, size, SANS_BOLD, THEME.heading, i => {
      const p = clamp((lt - i * 0.03) / 0.28);
      return { dx: 0, dy: -(1 - eOut(p)) * size * 0.35, sy: eBack(p), alpha: p > 0 ? 1 : 0 };
    });
    ctx.restore();
  },

  // 19 "not generated." lands heavy in gold serif, the answer to the cold open
  (lt) => {
    glow();
    const s = seg('not generated.', SERIF, THEME.gold);
    rich(ctx, s, W / 2, H / 2, fitSegs(s, 1640, 360), slam(lt, 0.2, 0.2, 20));
  },

  // 20 the peak, composed like the site's hero: frame, scrim, headline low left
  (lt) => {
    heroFrame(IMG.film, { scale: lerp(1.06, 1.12, lt) }, { scrim: 0.8, floor: 0.95 });
    const s = slam(lt, 0.06, 0.17, 8);
    const l1 = seg('Cinematic brand films.');
    const l2 = [{ t: 'Directed, ', o: SANS, c: THEME.heading }, { t: 'not generated.', o: SERIF, c: THEME.gold }];
    const size = fitSegs(l1, 1180, 130);
    const x = 96;
    rich(ctx, l1, x, H - 300, size, Object.assign({ align: 'left' }, s));
    rich(ctx, l2, x, H - 300 + size * 1.08, size, Object.assign({ align: 'left' }, s));
  },

  // 21 three rows of the work run in alternating directions, accelerating into the cut
  (lt) => {
    glow();
    const ramp = 0.3 * lt + 0.7 * lt * lt;
    REEL_ROWS.forEach((row, r) => {
      let x = row.x0 + row.dir * row.dist * ramp;
      row.keys.forEach(([key, portrait]) => {
        const w = portrait ? REEL.h * 4 / 5 : REEL.h * 16 / 9;
        if (x < W && x + w > 0) reelCard(IMG[key], x, REEL.y[r], w, REEL.h);
        x += w + REEL.gap;
      });
    });
  },

  // 22 the exhale: one beat of black
  () => {},

  // 23 the closing line lands over a wide shot
  (lt) => {
    closingShot(IMG.couple, { scale: lerp(1.0, 1.14, eOut(lt)), ox: lerp(30, -30, lt) });
    closingLine(lt, lt - 0.12);
  },

  // 24 hard cut to a tight shot, the line carries through
  (lt) => {
    closingShot(IMG.lips, { scale: lerp(1.16, 1.04, eOut(lt)) });
    closingLine(1, 1);
  },

  // 25 the video wall: the work deals out of a stack into a row, a hover sweeps across it
  (lt) => {
    glow();
    const rects = wallRects(lt);
    const order = [0, 4, 1, 3, 2];
    order.forEach(i => {
      const p = eSite((lt - [0.1, 0.05, 0, 0.05, 0.1][i]) / 0.55);
      const r = rects[i];
      const deck = { x: W / 2 - r.w / 2 + (i - 2) * 10, y: H / 2 - r.h / 2 + (i - 2) * 10 };
      const hover = clamp(1 - Math.abs(lt - (0.5 + i * 0.1)) / 0.12);
      videoTile(WALL[i], lerp(deck.x, r.x, p), lerp(deck.y, r.y, p) - 6 * hover, r.w, r.h,
        { rot: (i - 2) * 0.05 * (1 - p), hover, t: lt });
      const idx = rise(lt - 0.35 - i * 0.05, 0.5, 12);
      rich(ctx, seg('0' + (i + 1), Object.assign({}, EYEBROW, { track: 0.22 }), THEME.gold), r.x, r.y + r.h + 34, 16,
        { align: 'left', alpha: idx.alpha, dy: idx.dy });
    });
  },

  // 26 the camera dives into the hero film and it takes the frame
  (lt) => {
    glow();
    const rects = wallRects(1 + lt);
    const p = eInOut(lt / 0.7);
    const f = rects[2];
    const fx = f.x + f.w / 2, fy = f.y + f.h / 2;
    const i0 = THEME.frameInset;
    const kx = lerp(1, (W - 2 * i0) / f.w, p), ky = lerp(1, (H - 2 * i0) / f.h, p);
    const cx = lerp(fx, W / 2, p), cy = lerp(fy, H / 2, p);
    [0, 4, 1, 3, 2].forEach(i => {
      const r = rects[i];
      const x = cx + (r.x - fx) * kx, y = cy + (r.y - fy) * ky;
      const hero = i === 2;
      videoTile(WALL[i], x, y, r.w * kx, r.h * ky, {
        radius: lerp(THEME.cardRadius, hero ? THEME.frameRadius : THEME.cardRadius * 4, p),
        gold: hero ? 1 - eOut(lt / 0.3) : 0,
        badge: hero ? 1 - eOut(lt / 0.3) : 1,
        alpha: hero ? 1 : 1 - p,
        t: 1 + lt
      });
    });
    if (lt > 0.45) frameScrims(0.75, 0.9, eInOut((lt - 0.45) / 0.55));
  },

  // 27-29 the end card: portrait, statement, name, URL
  (lt) => endCard(lt),
  (lt) => endCard(1 + lt),
  (lt) => endCard(2 + lt)
];

/* The Work page's video tiles: two 16:9 films, three 9:16, the hero footage at the centre. */
const WALL = [
  { img: 'sheet', r: 9 / 16 },
  { img: 'film', r: 16 / 9 },
  { clip: true, r: 16 / 9 },
  { img: 'motoreasy', r: 9 / 16 },
  { img: 'carnival', r: 9 / 16 }
];

/* u = seconds since 25. The row drifts left the whole time. */
function wallRects(u) {
  const ph = 500, lw = 560, gap = 32;
  const stagger = [-44, 34, 0, -34, 44];
  const sizes = WALL.map(t => t.r < 1 ? { w: ph * t.r, h: ph } : { w: lw, h: lw / t.r });
  const total = sizes.reduce((a, s) => a + s.w, 0) + gap * (sizes.length - 1);
  let x = (W - total) / 2 + 120 - 150 * u;
  return sizes.map((s, i) => {
    const r = { x, y: H / 2 - s.h / 2 + stagger[i], w: s.w, h: s.h };
    x += s.w + gap;
    return r;
  });
}

/* u = seconds since 25; the hero footage starts playing as the wall appears. */
function clipFrame(u) {
  return CLIP_CACHE.get(clipIndex(u));
}

/* A video tile as the site draws it: 12px card, soft shadow, the play badge. */
function videoTile(tile, x, y, w, h, { rot = 0, hover = 0, gold = 0, badge = 1, alpha = 1, radius = THEME.cardRadius, t = 0, shade = 0 } = {}) {
  if (alpha <= 0.001) return;
  const img = tile.clip ? clipFrame(t) : IMG[tile.img];
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(x + w / 2, y + h / 2);
  ctx.rotate(rot);
  ctx.translate(-w / 2, -h / 2);
  ctx.shadowColor = 'rgba(0,0,0,0.6)';
  ctx.shadowBlur = 40;
  ctx.shadowOffsetY = 18;
  ctx.fillStyle = '#182444';
  roundRect(ctx, 0, 0, w, h, radius);
  ctx.fill();
  ctx.shadowColor = 'transparent';
  cover(ctx, img, 0, 0, w, h, { radius, scale: 1 + 0.05 * hover });
  if (shade > 0) {
    roundRect(ctx, 0, 0, w, h, radius);
    ctx.fillStyle = `rgba(${THEME.scrim},${shade})`;
    ctx.fill();
  }
  if (badge > 0) {
    const g = Math.max(hover, gold);
    const r = clamp(Math.min(w, h) * 0.1, 22, 30);
    ctx.globalAlpha = alpha * badge;
    ctx.beginPath();
    ctx.arc(w / 2, h / 2, r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(0,0,0,${0.3 + 0.2 * g})`;
    ctx.fill();
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = g > 0.5 ? `rgba(${THEME.goldRgb},0.8)` : 'rgba(44,58,91,0.5)';
    ctx.stroke();
    const s = r * 0.42;
    ctx.beginPath();
    ctx.moveTo(w / 2 - s * 0.55, h / 2 - s);
    ctx.lineTo(w / 2 - s * 0.55, h / 2 + s);
    ctx.lineTo(w / 2 + s * 0.95, h / 2);
    ctx.closePath();
    ctx.fillStyle = g > 0.5 ? THEME.gold : 'rgba(232,230,222,0.7)';
    ctx.fill();
  }
  ctx.restore();
}

function closingShot(img, opts) {
  heroFrame(img, opts, { scrim: 0.4, floor: 0.6 });
  const i = THEME.frameInset;
  ctx.save();
  roundRect(ctx, i, i, W - 2 * i, H - 2 * i, THEME.frameRadius);
  ctx.clip();
  const rg = ctx.createRadialGradient(W / 2, H / 2 - 60, 0, W / 2, H / 2 - 60, W * 0.5);
  rg.addColorStop(0, `rgba(${THEME.scrim},0.5)`);
  rg.addColorStop(1, `rgba(${THEME.scrim},0.1)`);
  ctx.fillStyle = rg;
  ctx.fillRect(0, 0, W, H);
  ctx.restore();
}

function closingLine(a, b) {
  const size = 92;
  const r1 = rise(a, 0.35, 20), r2 = rise(b, 0.35, 20);
  if (a > 0) rich(ctx, seg("Let's make something", SANS, THEME.cream), W / 2, H / 2 - 110, size, { alpha: r1.alpha, dy: r1.dy });
  if (b > 0) rich(ctx, seg('worth watching.', SERIF, THEME.ember), W / 2, H / 2 - 110 + size * 1.1, size, { alpha: r2.alpha, dy: r2.dy });
}

/* End card layout, after the site's Director section: a 3:4 portrait with
   16px corners beside the text, a 64px gutter between them. The portrait takes
   the height of 5 columns of a 1440px, 12 column grid; the portrait and text
   are centred together as one group, and the frame margins match top and bottom. */
const ROLE = 'My camera is AI.';
const NAME = 'Muneeb Arif';
const ROLE_O = Object.assign({}, SERIF, { k: 1 });
const NAME_O = Object.assign({}, SANS);
const URL_O = Object.assign({}, SANS, { track: 0.05 });
const CARD_SIZES = { role: 48, name: 120, url: 32 };

function cardLayout() {
  const container = 1440, cols = 12, gutter = 64;
  const col = (container - gutter * (cols - 1)) / cols;
  const pw = Math.round(col * 5 + gutter * 4), ph = Math.round(pw * 4 / 3);
  const textW = Math.max(
    segWidth(ctx, ROLE, CARD_SIZES.role, ROLE_O),
    segWidth(ctx, NAME, CARD_SIZES.name, NAME_O),
    segWidth(ctx, THEME.url, CARD_SIZES.url, URL_O));
  const left = Math.round((W - (pw + gutter + textW)) / 2);
  return {
    portrait: { x: left, y: Math.round((H - ph) / 2), w: pw, h: ph, r: 16 },
    textX: left + pw + gutter
  };
}

/* Offset that puts a line's first visible pixel exactly on x (removes side bearing). */
function inkLeft(text, size, o) {
  setFont(ctx, size, o);
  return ctx.measureText(text).actualBoundingBoxLeft;
}

/* u = seconds since 27. */
function endCard(u) {
  glow();
  const CARD = cardLayout();
  const p = CARD.portrait;
  const pr = rise(u, 0.8, 24);
  ctx.save();
  ctx.globalAlpha = pr.alpha;
  ctx.translate(0, pr.dy);
  ctx.shadowColor = 'rgba(0,0,0,0.35)';
  ctx.shadowBlur = 40;
  ctx.shadowOffsetY = 18;
  ctx.fillStyle = '#1C2E4E';
  roundRect(ctx, p.x, p.y, p.w, p.h, p.r);
  ctx.fill();
  ctx.shadowColor = 'transparent';
  cover(ctx, IMG.portrait, p.x, p.y, p.w, p.h, { radius: p.r, scale: lerp(1.08, 1.0, eOut(u / 3)) });
  ctx.restore();

  // Text block: role, name, URL, stacked by cap height and centred on the
  // portrait's vertical centre.
  const roleO = ROLE_O, nameO = NAME_O, urlO = URL_O;
  const sizes = CARD_SIZES;
  const caps = { role: capHeight(ctx, sizes.role, roleO), name: capHeight(ctx, sizes.name, nameO), url: capHeight(ctx, sizes.url, urlO) };
  const gapA = 40, gapB = 56;
  const block = caps.role + gapA + caps.name + gapB + caps.url;
  let top = p.y + p.h / 2 - block / 2;
  const rows = [
    ['role', ROLE, roleO, THEME.ember, 0.15],
    ['name', NAME, nameO, THEME.heading, 0.23],
    ['url', THEME.url, urlO, THEME.gold, 0.35]
  ];
  rows.forEach(([k, text, o, color, delay], i) => {
    const r = rise(u - delay, 0.7, 20);
    const x = CARD.textX + inkLeft(text, sizes[k], o);
    rich(ctx, seg(text, o, color), x, top + caps[k] / 2, sizes[k], { align: 'left', alpha: r.alpha, dy: r.dy });
    top += caps[k] + (i === 0 ? gapA : gapB);
  });
}

function render(t) {
  t = clamp(+t || 0, 0, window.DURATION);
  const sec = Math.min(29, Math.floor(t));
  const lt = t - sec;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
  ctx.filter = 'none';
  ctx.fillStyle = sec === 0 || sec === 22 ? '#000' : THEME.bg;
  ctx.fillRect(0, 0, W, H);
  BEATS[sec](lt, t);
  if ((t >= 1 && t < 22) || t >= 23) grain(t);
}

window.seek = async function (t) {
  await ready;
  const c = clamp(+t || 0, 0, window.DURATION);
  const u = clipTime(c);
  if (u !== null) await ensureClip(clipIndex(u));
  render(t);
};

window.seek(0);

/* Optional scrubber: open with ?preview */
if (/[?&]preview\b/.test(location.search)) {
  const s = document.createElement('input');
  s.type = 'range'; s.id = 'scrub'; s.min = 0; s.max = window.DURATION; s.step = 1 / 30; s.value = 0;
  s.addEventListener('input', () => window.seek(+s.value));
  document.body.appendChild(s);
}
</script>
</body>
</html>
